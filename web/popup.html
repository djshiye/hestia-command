<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hestia</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <img src="icon.svg" alt="" width="26" height="26">
  <b>Hestia</b>
  <span class="grow"></span>
  <button class="link" id="openBtn" title="Open the full Hestia window">Open app</button>
</header>
<main id="list" class="list" aria-live="polite"></main>
<footer class="foot">
  <span class="muted small" id="status">Connecting…</span>
  <span class="grow"></span>
  <button class="link danger" id="quitBtn">Quit Hestia</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
