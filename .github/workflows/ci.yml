name: Checks

# Runs on every push and pull request: vet, tests, static analysis and a
# vulnerability scan of the dependencies. One small Linux job, about a minute.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test (Linux and Windows targets)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
          GOOS=windows go test -c -o /dev/null .

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Static analysis
        run: |
          staticcheck ./...
          GOOS=windows staticcheck ./...

      - name: Known-vulnerability scan
        run: |
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: Cross-compile the Windows build
        run: ./build.sh 0.0.0-ci
